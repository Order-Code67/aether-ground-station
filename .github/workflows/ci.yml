name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Full NSIS is slow — on-demand / tags only (not every PR).
  nsis-smoke:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Tauri dependencies
        run: |
          # WebView2 / VS build tools assumed on GitHub windows-latest
          npm run tauri build
