  "db_upsert_json",
  "db_get_json",
  "db_list_users",
  "db_verify_user_password",
  "db_upsert_recording",
  "db_list_recordings",
  "db_audit",
  "station_list",
  "station_upsert",
  "station_delete",
  "inventory_list",
  "inventory_upsert",
  "maintenance_list",
  "maintenance_upsert",
  "telemetry_append",
  "report_complex_summary",
